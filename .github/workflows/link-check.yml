name: Link check

on:
  push:
  pull_request:

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # nbviewer renders notebooks on request, and answers 202 or 503 while
          # it does: its links are checked by hand
          args: ". --accept 200,403 --exclude ^https://nbviewer\\.jupyter\\.org/"
          fail: true
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
