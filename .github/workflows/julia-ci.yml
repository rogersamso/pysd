# CI for Julia builder tests.
#
# Split into two jobs:
#   1. julia-unit-and-translation — runs the 382 unit tests and the 799
#      translation-only integration tests.  No Julia binary is needed; these
#      are pure-Python tests that generate .jl files.
#   2. julia-numerical — runs only the 27 @pytest.mark.julia tests that
#      actually execute Julia.  This job installs Julia + packages (slow
#      on the first run, cached on subsequent runs).
#
# Keeping precompilation isolated to job 2 means the fast Python-only tests
# are never blocked by Julia package installation time.

name: Julia CI

on:
  push:
    paths:
      - 'pysd/builders/julia/**'
      - 'tests/pytest_builders/pytest_julia*.py'
      - '.github/workflows/julia-ci.yml'
  pull_request:
    paths:
      - 'pysd/builders/julia/**'
      - 'tests/pytest_builders/pytest_julia*.py'
      - '.github/workflows/julia-ci.yml'
  workflow_dispatch:
  schedule:
    # Run weekly to catch Julia/MTK upstream breakage
    - cron: '0 8 * * 1'

jobs:
  # -------------------------------------------------------------------------
  # Job 1: unit tests + translation integration tests (no Julia binary needed)
  # -------------------------------------------------------------------------
  julia-python-tests:
    name: Julia builder — Python-only tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -U pip wheel
          pip install --prefer-binary -r tests/requirements.txt
          pip install --prefer-binary -e .

      - name: Run unit tests
        run: |
          pytest tests/pytest_builders/pytest_julia.py -v --tb=short

      - name: Run translation integration tests (no Julia runtime needed)
        run: |
          pytest tests/pytest_builders/pytest_julia_integration.py -m "not julia" -v --tb=short

  # -------------------------------------------------------------------------
  # Job 2: numerical tests (require Julia runtime)
  # -------------------------------------------------------------------------
  julia-numerical-tests:
    name: Julia builder — numerical tests (Julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Install Julia packages
        run: |
          julia --startup-file=no -e '
            using Pkg
            Pkg.add(["ModelingToolkit", "Symbolics", "OrdinaryDiffEq",
                     "OrdinaryDiffEqLowOrderRK", "DataInterpolations",
                     "NCDatasets", "JSON3"])
            Pkg.develop(PackageSpec(path="pysd/builders/julia/PySD.jl"))
            Pkg.precompile()
          '

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -U pip wheel
          pip install --prefer-binary -r tests/requirements.txt
          pip install --prefer-binary -e .

      - name: Run numerical integration tests
        run: |
          pytest tests/pytest_builders/pytest_julia_integration.py -m julia -v --tb=short
